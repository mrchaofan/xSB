name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact version commit to build
        type: string
        required: true
      build_packages:
        description: Build application archives for a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # npm installs the patched downloader; electron-builder fetches the configured mirror at packaging time.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package ${{ matrix.target }}
    if: ${{ inputs.build_packages == true }}
    needs: checks
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
            platform: mac
            arch: arm64
          - runner: windows-latest
            target: win-x64
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Require hosted release workflow
        env:
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          SELECTED_REF: ${{ github.ref }}
          TRIGGER: ${{ github.event_name }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$TRIGGER" = workflow_dispatch
          test "$SELECTED_REF" = refs/heads/main
          test "$CALLER_WORKFLOW" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @xsb/desktop
      - name: Package application
        working-directory: packages/desktop
        run: npx --no-install electron-builder --config electron-builder.config.mjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Record archive checksum and actual build source
        env:
          APP_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'));
          const file = `xsb-${version}-${process.env.APP_TARGET}.zip`;
          const archive = `packages/desktop/release/${file}`;
          const bytes = fs.readFileSync(archive);
          if (!bytes.length) throw new Error(`Empty application archive: ${file}`);
          const digest = createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(`${archive}.sha256`, `${digest}  ${file}\n`);
          // The version commit is created after workflow dispatch; it differs from GITHUB_SHA.
          fs.writeFileSync(`${archive}.build.json`, JSON.stringify({
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            workflowSha: process.env.GITHUB_SHA,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            version,
            target: process.env.APP_TARGET,
            archive: file,
            sha256: digest,
          }, null, 2) + '\n');
          NODE
      - name: Attest application and build record
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            packages/desktop/release/*.zip
            packages/desktop/release/*.zip.build.json
      - name: Keep signed bundle with application
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for archive in packages/desktop/release/*.zip; do
            cp "$BUNDLE_PATH" "$archive.attestation.jsonl"
          done
      - name: Archive application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xsb-${{ matrix.target }}
          path: |
            packages/desktop/release/*.zip
            packages/desktop/release/*.zip.sha256
            packages/desktop/release/*.zip.build.json
            packages/desktop/release/*.zip.attestation.jsonl
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
