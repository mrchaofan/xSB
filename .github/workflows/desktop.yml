name: Desktop CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # npm installs the patched downloader; electron-builder fetches the configured mirror at packaging time.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match the desktop version: v${version}`);
          }
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package ${{ matrix.target }}
    needs: checks
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
            platform: mac
            arch: arm64
          - runner: windows-latest
            target: win-x64
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @xsb/desktop
      - name: Package application
        working-directory: packages/desktop
        run: npx --no-install electron-builder --config electron-builder.config.mjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify archive and write checksum
        env:
          APP_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const { version } = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'));
          const file = `xsb-${version}-${process.env.APP_TARGET}.zip`;
          const archive = `packages/desktop/release/${file}`;
          const bytes = fs.readFileSync(archive);
          if (!bytes.length) throw new Error(`Empty application archive: ${file}`);
          const digest = createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(`${archive}.sha256`, `${digest}  ${file}\n`);
          NODE
      - name: Archive application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xsb-${{ matrix.target }}
          path: |
            packages/desktop/release/*.zip
            packages/desktop/release/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release archives
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xsb-*
          path: release
          merge-multiple: true
      - name: Verify downloaded archives
        working-directory: release
        run: sha256sum --check *.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.zip.sha256 --clobber
          else
            options=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/*.zip release/*.zip.sha256 "${options[@]}"
          fi
