<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="app.title"></title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 一个网页自己的窗口：page-window.js -->
<header class="bar titlebar">
  <strong class="web-title" id="title"></strong>
  <button class="icon-btn" id="annotate" data-t-title="web.annotate" data-t-aria-label="web.annotate" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/><path d="M5 6.5h6M5 8.5h4"/></svg></button>
  <button class="icon-btn" id="pin" data-t-title="pagewindow.pin.title" data-t-aria-label="pagewindow.pin" aria-pressed="false">
    <svg viewBox="0 0 16 16"><path d="M5.5 2h5l-.7 4.2 2.2 2.3h-8l2.2-2.3zM8 8.5V14"/></svg>
  </button>
  <button class="btn" id="restore" data-t="web.restore"></button>
</header>
<div class="annotate-bar" id="annotate-bar" role="toolbar" hidden></div>
<div class="web-body" id="web-body"></div>

<script src="page-window.js"></script>
</body>
</html>
